name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check gerberdiff/ tests/
      - run: uv run ruff format --check gerberdiff/ tests/
      - name: Check for non-ASCII characters
        run: |
          if grep -rP '[^\x00-\x7F]' gerberdiff/ tests/ *.md *.toml; then
            echo "Non-ASCII characters found"
            exit 1
          fi

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run mypy gerberdiff/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.11"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - name: Test (with coverage gate)
        if: matrix.os != 'windows-latest'
        run: uv run pytest tests/ --cov=gerberdiff --cov-report=xml --cov-fail-under=90 -q
      - name: Test (Windows, no system cairo -- raster tests skip)
        if: matrix.os == 'windows-latest'
        run: uv run pytest tests/ -q
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # The ONLY job branch protection requires. Add every new job to `needs:` here
  # rather than to the protection settings, so CI can evolve without touching
  # repository configuration.
  #
  # It requires SUCCESS rather than testing for failure. `contains(needs.*.result,
  # 'failure')` does not match 'skipped', so an `if: false` on a real job produces a
  # fully green pull request with nothing checked -- measured in a sibling repo.
  # This workflow has no path filtering, so no job here skips legitimately; a repo
  # that does filter needs the tolerant form instead.
  ok:
    name: ok
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every upstream job succeeded
        if: >-
          needs.lint.result != 'success' ||
          needs.typecheck.result != 'success' ||
          needs.test.result != 'success'
        run: exit 1
      - name: Pass
        run: echo 'All checks passed'

